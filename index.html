<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Jay Setup</title>
<style>
  :root { --bg:#0e0f14; --panel:#171922; --line:#262a38; --text:#e8eaf2; --dim:#8b90a3; --accent:#7c5cff; --ok:#3ddc97; --bad:#ff5d6c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:16px 20px 8px; }
  h1 { margin:0; font-size:20px; }
  .sub { color:var(--dim); font-size:12px; margin-top:2px; }
  .tabs { display:flex; gap:6px; padding:0 20px 10px; }
  .tabs button { flex:0 0 auto; }
  .tabs button.active { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 12px; align-items:center; }
  .count { margin-left:auto; color:var(--dim); font-size:12px; }
  section { flex:1; min-height:0; display:none; flex-direction:column; }
  section.active { display:flex; }
  .list { flex:1; overflow:auto; padding:0 20px 12px; }
  .cat { margin:14px 0 6px; display:flex; align-items:center; gap:10px; }
  .cat h2 { margin:0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .cat button { padding:2px 10px; font-size:11px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:8px; }
  label.item { display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; min-height:44px; }
  label.item:has(input:checked) { border-color:var(--accent); }
  label.item input { accent-color:var(--accent); width:16px; height:16px; flex:none; }
  label.item .txt { flex:1; min-width:0; }
  label.item .name { overflow:hidden; text-overflow:ellipsis; }
  label.item .desc { color:var(--dim); font-size:11px; margin-top:1px; }
  .badge { font-size:11px; color:var(--dim); flex:none; }
  .badge.running { color:var(--accent); } .badge.done { color:var(--ok); } .badge.failed { color:var(--bad); }
  #log { height:130px; margin:0 20px 8px; background:#0a0b0f; border:1px solid var(--line); border-radius:8px; padding:8px 10px; overflow:auto; font:12px/1.4 Consolas, monospace; color:var(--dim); white-space:pre-wrap; word-break:break-word; }
  #warn, #note { display:none; margin:0 20px 10px; padding:10px 12px; border:1px solid var(--bad); border-radius:8px; color:var(--bad); }
  #note { border-color:var(--accent); color:var(--text); }
  footer { text-align:center; color:var(--dim); font-size:11px; padding:0 0 10px; }
  @media (max-width:520px) {
    .bar { gap:6px; padding-bottom:8px; } .bar button { flex:1 1 28%; padding:6px 8px; font-size:13px; }
    .count { width:100%; margin:0; }
    .grid { grid-template-columns:1fr; } #log { height:70px; }
    .tabs button { flex:1; }
  }
</style>
</head>
<body>
<header>
  <h1>Jay Setup</h1>
  <div class="sub">Install your apps and apply Windows tweaks after a fresh install.</div>
</header>
<div class="tabs">
  <button id="tab-apps-btn" class="active">Apps</button>
  <button id="tab-tweaks-btn">Windows Tweaks</button>
</div>
<div id="warn"></div>
<div id="note"></div>

<section id="sec-apps" class="active">
  <div class="bar">
    <button id="apps-all">Select all</button>
    <button id="apps-none">Select none</button>
    <button id="apps-go" class="primary">Install selected</button>
    <button id="apps-stop" class="danger" style="display:none">Cancel</button>
    <span class="count" id="apps-count"></span>
  </div>
  <div class="list" id="apps-list"></div>
</section>

<section id="sec-tweaks">
  <div class="bar">
    <button id="tw-all">Select all</button>
    <button id="tw-none">Select none</button>
    <button id="tw-go" class="primary">Apply selected</button>
    <button id="tw-undo">Revert selected</button>
    <button id="tw-explorer">Restart Explorer</button>
    <span class="count" id="tw-count"></span>
  </div>
  <div class="list" id="tw-list"></div>
</section>

<div id="log"></div>
<footer>Designed by: Jayden M.</footer>

<script>
const $ = (s) => document.querySelector(s);
let busy = false;
const stores = { apps: { boxes: {}, badges: {} }, tw: { boxes: {}, badges: {} } };

function log(line) { const el = $("#log"); el.textContent += line + "\n"; el.scrollTop = el.scrollHeight; }
function selected(k) { const b = stores[k].boxes; return Object.keys(b).filter((id) => b[id].checked); }

function refresh() {
  $("#apps-count").textContent = selected("apps").length + " selected";
  $("#tw-count").textContent = selected("tw").length + " selected";
  const noWinget = $("#warn").style.display === "block";
  $("#apps-go").disabled = busy || noWinget || !selected("apps").length;
  $("#tw-go").disabled = $("#tw-undo").disabled = busy || !selected("tw").length;
  $("#tw-explorer").disabled = busy;
  for (const id of ["#apps-all", "#apps-none", "#tw-all", "#tw-none"]) $(id).disabled = busy;
  for (const k of ["apps", "tw"]) Object.values(stores[k].boxes).forEach((b) => (b.disabled = busy));
  $("#apps-stop").style.display = busy && busy === "apps" ? "" : "none";
}

function render(listEl, items, store) {
  const cats = [...new Set(items.map((a) => a.cat))];
  for (const cat of cats) {
    const head = document.createElement("div");
    head.className = "cat";
    head.innerHTML = "<h2></h2><button>Toggle</button>";
    head.querySelector("h2").textContent = cat;
    const grid = document.createElement("div");
    grid.className = "grid";
    const mine = [];
    for (const a of items.filter((x) => x.cat === cat)) {
      const l = document.createElement("label");
      l.className = "item";
      l.innerHTML = '<input type="checkbox"><span class="txt"><div class="name"></div><div class="desc"></div></span><span class="badge"></span>';
      const cb = l.querySelector("input");
      cb.checked = !!a.on;
      cb.addEventListener("change", refresh);
      l.querySelector(".name").textContent = a.name;
      if (a.desc) l.querySelector(".desc").textContent = a.desc; else l.querySelector(".desc").remove();
      store.boxes[a.id] = cb;
      store.badges[a.id] = l.querySelector(".badge");
      mine.push(cb);
      grid.appendChild(l);
    }
    head.querySelector("button").onclick = () => {
      const all = mine.every((c) => c.checked);
      mine.forEach((c) => (c.checked = !all));
      refresh();
    };
    listEl.append(head, grid);
  }
}

function showTab(name) {
  for (const t of ["apps", "tweaks"]) {
    $("#sec-" + t).classList.toggle("active", t === name);
    $("#tab-" + t + "-btn").classList.toggle("active", t === name);
  }
}
$("#tab-apps-btn").onclick = () => showTab("apps");
$("#tab-tweaks-btn").onclick = () => showTab("tweaks");

(async function init() {
  const [apps, tweaks, wg] = await Promise.all([setup.getApps(), setup.getTweaks(), setup.checkWinget()]);
  if (!wg.ok) {
    const w = $("#warn");
    w.style.display = "block";
    w.textContent = "winget was not found. Open the Microsoft Store, update \"App Installer\", then restart Jay Setup. (Tweaks still work.)";
  }
  render($("#apps-list"), apps, stores.apps);
  render($("#tw-list"), tweaks, stores.tw);
  refresh();
})();

const setAll = (k, v) => () => { Object.values(stores[k].boxes).forEach((b) => (b.checked = v)); refresh(); };
$("#apps-all").onclick = setAll("apps", true);
$("#apps-none").onclick = setAll("apps", false);
$("#tw-all").onclick = setAll("tw", true);
$("#tw-none").onclick = setAll("tw", false);

function resetBadges(k, ids, text) {
  Object.values(stores[k].badges).forEach((b) => { b.textContent = ""; b.className = "badge"; });
  ids.forEach((id) => { stores[k].badges[id].textContent = text; });
}

$("#apps-go").onclick = async () => {
  const ids = selected("apps");
  if (!ids.length) return;
  resetBadges("apps", ids, "queued");
  $("#log").textContent = "";
  busy = "apps"; refresh();
  const r = await setup.install(ids);
  busy = false; refresh();
  log(r.cancelled ? "Cancelled." : `Finished: ${r.done} installed, ${r.failed} failed.`);
};
$("#apps-stop").onclick = () => setup.cancel();

async function runTweaks(mode) {
  const ids = selected("tw");
  if (!ids.length) return;
  resetBadges("tw", ids, "queued");
  $("#log").textContent = "";
  $("#note").style.display = "none";
  busy = "tw"; refresh();
  const r = await setup.applyTweaks(ids, mode);
  busy = false; refresh();
  log(`Finished: ${r.ok} ${mode === "on" ? "applied" : "reverted"}, ${r.failed} failed.`);
  const needs = [];
  if (r.explorer) needs.push("press Restart Explorer to see the changes");
  if (r.reboot) needs.push("sign out or restart for some changes to fully apply");
  if (needs.length) {
    const n = $("#note");
    n.style.display = "block";
    n.textContent = "To finish: " + needs.join(", and ") + ".";
  }
}
$("#tw-go").onclick = () => runTweaks("on");
$("#tw-undo").onclick = () => runTweaks("off");
$("#tw-explorer").onclick = async () => {
  log("Restarting Explorer (your taskbar will flash)...");
  await setup.restartExplorer();
};

setup.onLog(log);
setup.onStatus(({ id, state, reboot, label }) => {
  const b = stores.apps.badges[id] || stores.tw.badges[id];
  if (!b) return;
  b.className = "badge " + state;
  b.textContent = { running: "working…", done: label || (reboot ? "done (reboot)" : "done"), failed: "failed", cancelled: "cancelled" }[state];
});
</script>
</body>
</html>
