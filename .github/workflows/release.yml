name: Release

# Builds the installer and portable exe on GitHub's own Windows runners, writes SHA-256
# checksums, signs a build-provenance attestation, and attaches everything to a GitHub Release.
# Start it by pushing a tag, for example:  git tag v1.4.0 ; git push origin v1.4.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (exact versions from the lockfile)
        run: npm ci

      - name: Build installer and portable exe
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem JaySetup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/JaySetup-Setup.exe
            dist/JaySetup-Portable.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/JaySetup-Setup.exe dist/JaySetup-Portable.exe dist/SHA256SUMS.txt `
            --title "Jay Setup ${{ github.ref_name }}" `
            --notes "Download **JaySetup-Setup.exe** to install, or **JaySetup-Portable.exe** to run without installing. Verify your download with SHA256SUMS.txt or 'gh attestation verify' (see SECURITY.md)."

      - name: Keep build output (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: JaySetup
          path: |
            dist/JaySetup-Setup.exe
            dist/JaySetup-Portable.exe
            dist/SHA256SUMS.txt
